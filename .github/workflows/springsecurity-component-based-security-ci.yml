name: SpringSecurity - ComponentBasedSecurity CI

env:
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    paths:
      - "SpringSecurity/component-based-security/**"
      - ".github/workflows/springsecurity-component-based-security-ci.yml"
  pull_request:
    paths:
      - "SpringSecurity/component-based-security/**"
      - ".github/workflows/springsecurity-component-based-security-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: SpringSecurity/component-based-security

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: SpringSecurity/component-based-security/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
