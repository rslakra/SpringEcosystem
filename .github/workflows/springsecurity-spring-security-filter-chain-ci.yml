name: SpringSecurity - SpringSecurityFilterChain CI

env:
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    branches:
      - master
    paths:
      - "SpringSecurity/spring-security-filter-chain/**"
      - ".github/workflows/springsecurity-spring-security-filter-chain-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "SpringSecurity/spring-security-filter-chain/**"
      - ".github/workflows/springsecurity-spring-security-filter-chain-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: SpringSecurity/spring-security-filter-chain

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: SpringSecurity/spring-security-filter-chain/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
