name: Spring - SpringAnnotation CI

env:
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    paths:
      - "Spring/spring-annotation/**"
      - ".github/workflows/spring-annotation-ci.yml"
  pull_request:
    paths:
      - "Spring/spring-annotation/**"
      - ".github/workflows/spring-annotation-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Spring/spring-annotation

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: Spring/spring-annotation/pom.xml

      # The project has no tests yet: this compiles it and runs Checkstyle (the pom runs it at
      # process-classes, with the rules downloaded from rslakra/code-styles).
      - name: Build and run unit tests
        run: mvn -B -ntp test
